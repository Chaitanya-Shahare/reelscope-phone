<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="reelscope">
<meta name="theme-color" content="#111110">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg">
<title>reelscope</title>
<style>
  /* Dark and light are each chosen (dataviz reference palette), not flipped. */
  :root { color-scheme: light; --bg: #f4f3f0; --surface: #fcfcfb; --line: #e4e2dc; --grid: #ebe9e4; --text: #0b0b0b; --text2: #52514e; --muted: #8a8984;
    --series: #2a78d6; --good: #0a7d0a; --warn: #b07800; --bad: #d03b3b; --chip: #efeee9; }
  @media (prefers-color-scheme: dark) {
    :root { color-scheme: dark; --bg: #111110; --surface: #1a1a19; --line: #2a2a28; --grid: #262624; --text: #f0efec; --text2: #c3c2b7; --muted: #8d8c85;
      --series: #3987e5; --good: #0ca30c; --warn: #fab219; --bad: #e66767; --chip: #242422; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; }
  body { padding: calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 28px); max-width: 640px; margin: 0 auto; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .top h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
  .top .upd { font-size: 12px; color: var(--muted); text-align: right; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-top: 12px; }
  .card h2 { margin: 0 0 2px; font-size: 13px; font-weight: 600; color: var(--text2); }
  .card .note { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .hero { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 8px; align-items: end; }
  .hero .big { font-size: 40px; font-weight: 700; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .hero .lab { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .hero .num { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .meter { height: 8px; border-radius: 4px; background: var(--chip); overflow: hidden; margin: 10px 0 6px; }
  .meter i { display: block; height: 100%; background: var(--series); border-radius: 4px; }
  .goal { display: flex; justify-content: space-between; font-size: 13px; color: var(--text2); gap: 10px; }
  .goal b { color: var(--text); font-variant-numeric: tabular-nums; }
  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .tile .num { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .tile .lab { font-size: 12px; color: var(--muted); }
  svg.chart { width: 100%; display: block; overflow: visible; touch-action: pan-y; }
  svg .grid { stroke: var(--grid); stroke-width: 1; } svg .axis { fill: var(--muted); font-size: 10px; }
  svg .line { fill: none; stroke: var(--series); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  svg .bar { fill: var(--series); } svg .bar.on { opacity: .7; }
  svg .cross { stroke: var(--muted); stroke-width: 1; } svg .dot { fill: var(--series); stroke: var(--surface); stroke-width: 2; }
  .readout { font-size: 13px; color: var(--text2); min-height: 20px; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .readout b { color: var(--text); }
  .seg { display: flex; background: var(--chip); border-radius: 10px; padding: 3px; gap: 2px; margin: 4px 0 6px; }
  .seg button { flex: 1; padding: 6px 4px; border-radius: 8px; font-size: 13px; color: var(--text2); }
  .seg button.on { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .reel { padding: 11px 0; border-top: 1px solid var(--line); }
  .reel:first-of-type { border-top: 0; }
  .reel .t { font-weight: 600; font-size: 15px; display: flex; gap: 6px; align-items: baseline; }
  .reel .t span:first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reel .when { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .reel .m { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .reel .m b { display: block; font-size: 17px; } .reel .m small { font-size: 11px; color: var(--muted); }
  .reel .s { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .badge { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 6px; background: var(--chip); color: var(--text2); white-space: nowrap; }
  .day { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 10px 0 2px; }
  .up { display: flex; gap: 8px; align-items: baseline; padding: 6px 0; font-size: 14px; }
  .up .h { width: 74px; white-space: nowrap; color: var(--text2); font-variant-numeric: tabular-nums; flex: none; }
  .up .x { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .st { display: flex; gap: 10px; padding: 7px 0; font-size: 14px; border-top: 1px solid var(--line); }
  .st:first-of-type { border-top: 0; }
  .st .i { width: 18px; flex: none; font-weight: 700; text-align: center; }
  .st .i.ok { color: var(--good); } .st .i.warn { color: var(--warn); } .st .i.bad { color: var(--bad); }
  .st .d { font-size: 12px; color: var(--muted); }
  .more { display: block; width: 100%; text-align: center; padding: 10px 0 2px; color: var(--series); font-size: 14px; font-weight: 600; }
  .foot { text-align: center; font-size: 12px; color: var(--muted); margin-top: 18px; }
  .foot button { color: var(--series); }
  #lock { min-height: 70vh; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
  #lock h1 { margin: 0; font-size: 24px; }
  #lock p { margin: 0; color: var(--text2); }
  #lock input { font: inherit; font-size: 17px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--text); outline: none; }
  #lock input:focus { border-color: var(--series); }
  #lock .go { background: var(--series); color: #fff; border-radius: 12px; padding: 12px; font-weight: 600; font-size: 16px; }
  #lock .err { color: var(--bad); font-size: 14px; min-height: 20px; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; margin-top: 6px; }
  .tbl td, .tbl th { padding: 3px 4px; text-align: right; border-bottom: 1px solid var(--line); } .tbl th { color: var(--muted); font-weight: 500; }
  .tbl td:first-child, .tbl th:first-child { text-align: left; }
  details summary { font-size: 12px; color: var(--muted); cursor: pointer; margin-top: 6px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const $app = document.getElementById('app');
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nf = (n) => n == null ? '–' : Math.abs(n) >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : Math.abs(n) >= 1e4 ? (n / 1e3).toFixed(n >= 1e5 ? 0 : 1) + 'K' : n.toLocaleString('en-IN');
const sign = (n) => n == null ? '–' : (n > 0 ? '+' : '') + n.toLocaleString('en-IN');
const IST = { timeZone: 'Asia/Kolkata' };
const tm = (t) => new Date(t * 1000).toLocaleTimeString('en-IN', { ...IST, hour: 'numeric', minute: '2-digit' });
const dm = (t) => new Date(t * 1000).toLocaleDateString('en-IN', { ...IST, day: 'numeric', month: 'short' });
const dayKey = (t) => new Date(t * 1000).toLocaleDateString('en-CA', IST);
// Relative and absolute, so a stale reading is obvious without guessing: "42 min ago (8:05 am IST)".
const stamp = (t) => { const d = new Date(t * 1000), o = { timeZone: 'Asia/Kolkata' }, day = (x) => x.toLocaleDateString('en-IN', o); return (day(d) === day(new Date()) ? '' : d.toLocaleDateString('en-IN', { ...o, weekday: 'short', day: 'numeric', month: 'short' }) + ', ') + d.toLocaleTimeString('en-IN', { ...o, hour: 'numeric', minute: '2-digit' }) + ' IST'; };
const ago = (t) => { const m = Math.round((Date.now() / 1000 - t) / 60); return (m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 2880 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} days ago`) + ` (${stamp(t)})`; };
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

// ---------- unlock: the data is AES-256-GCM, key from the passphrase (PBKDF2-SHA256) ----------
async function decrypt(box, pass) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(box.salt), iterations: box.iter }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(box.iv) }, key, b64(box.ct))));
}
async function fetchBox() { const r = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' }); if (!r.ok) throw new Error('could not load data (' + r.status + ')'); return r.json(); }
function lockScreen(err = '') {
  $app.innerHTML = `<div id="lock"><h1>reelscope</h1><p>Enter the passphrase. This phone remembers it.</p>
    <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" placeholder="passphrase">
    <button class="go" id="go">Unlock</button><div class="err">${esc(err)}</div></div>`;
  const go = async () => { const p = document.getElementById('pw').value.trim(); if (!p) return; document.getElementById('go').textContent = 'Unlocking…'; await load(p, true); };
  document.getElementById('go').onclick = go;
  document.getElementById('pw').onkeydown = (e) => { if (e.key === 'Enter') go(); };
}
let D = null, sortBy = localStorage.getItem('rs.sort') || 'new', showAll = false, ytAll = false;
async function load(pass = localStorage.getItem('rs.pass'), fresh = false) {
  if (!pass) return lockScreen();
  let box;
  try { box = await fetchBox(); } catch (e) { if (D) return render(); return lockScreen(e.message); }
  try { D = await decrypt(box, pass); } catch { localStorage.removeItem('rs.pass'); return lockScreen(fresh ? 'That passphrase does not open it.' : 'The passphrase changed. Enter the new one.'); }
  localStorage.setItem('rs.pass', pass);
  render();
}

// ---------- charts: one series each, thin marks, recessive grid, tap/drag readout ----------
function niceMax(v) { if (v <= 0) return 1; const p = 10 ** Math.floor(Math.log10(v)); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function lineChart(pts) {
  if (pts.length < 2) return '<div class="note">Not enough readings yet.</div>';
  const W = 600, H = 170, P = { l: 40, r: 6, t: 8, b: 20 };
  const x0 = pts[0].t, x1 = pts.at(-1).t, lo = Math.min(...pts.map((p) => p.v)), hi = Math.max(...pts.map((p) => p.v)), pad = Math.max(5, (hi - lo) * .12);
  const y0 = Math.floor((lo - pad) / 5) * 5, y1 = Math.ceil((hi + pad) / 5) * 5;
  const X = (t) => P.l + (W - P.l - P.r) * (t - x0) / Math.max(1, x1 - x0), Y = (v) => P.t + (H - P.t - P.b) * (1 - (v - y0) / Math.max(1, y1 - y0));
  const ticks = [y0, Math.round((y0 + y1) / 2), y1], days = [];
  for (let t = x0; t <= x1; t += 86400 * Math.ceil((x1 - x0) / 86400 / 5)) days.push(t);
  return `<svg class="chart" id="lc" viewBox="0 0 ${W} ${H}" role="img" aria-label="Followers over the last 14 days, from ${lo} to ${hi}">
    ${ticks.map((v) => `<line class="grid" x1="${P.l}" x2="${W - P.r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axis" x="${P.l - 6}" y="${Y(v) + 3}" text-anchor="end">${nf(v)}</text>`).join('')}
    ${days.map((t) => `<text class="axis" x="${X(t)}" y="${H - 4}" text-anchor="middle">${dm(t)}</text>`).join('')}
    <path class="line" d="${pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join('')}"/>
    <g id="lch" style="display:none"><line class="cross" y1="${P.t}" y2="${H - P.b}"/><circle class="dot" r="5"/></g>
    <rect x="${P.l}" y="0" width="${W - P.l - P.r}" height="${H}" fill="transparent" id="lchit"/></svg>
    <div class="readout" id="lcr">Latest <b>${pts.at(-1).v.toLocaleString('en-IN')}</b> · touch the chart to read a point</div>`;
}
function wireLine(pts) {
  const svg = document.getElementById('lc'); if (!svg) return;
  const W = 600, P = { l: 40, r: 6 }, x0 = pts[0].t, x1 = pts.at(-1).t;
  const g = document.getElementById('lch'), path = svg.querySelector('.line');
  const at = (e) => {
    const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W, t = x0 + (x1 - x0) * (x - P.l) / (W - P.l - P.r);
    let best = pts[0]; for (const p of pts) if (Math.abs(p.t - t) < Math.abs(best.t - t)) best = p;
    const px = P.l + (W - P.l - P.r) * (best.t - x0) / Math.max(1, x1 - x0);
    const seg = path.getAttribute('d').split(/[ML]/).filter(Boolean)[pts.indexOf(best)].split(',');
    g.style.display = ''; g.querySelector('line').setAttribute('x1', px); g.querySelector('line').setAttribute('x2', px);
    g.querySelector('circle').setAttribute('cx', seg[0]); g.querySelector('circle').setAttribute('cy', seg[1]);
    document.getElementById('lcr').innerHTML = `<b>${best.v.toLocaleString('en-IN')}</b> followers · ${dm(best.t)}, ${tm(best.t)}`;
  };
  svg.addEventListener('pointerdown', at); svg.addEventListener('pointermove', (e) => { if (e.pressure > 0 || e.pointerType === 'mouse') at(e); });
}
function barChart(items, id, tip) {
  if (!items.length) return '<div class="note">No data yet.</div>';
  const W = 600, H = 150, P = { l: 30, r: 4, t: 8, b: 20 }, max = niceMax(Math.max(...items.map((x) => x.value)));
  const bw = (W - P.l - P.r) / items.length, Y = (v) => P.t + (H - P.t - P.b) * (1 - v / max), every = Math.ceil(items.length / 6);
  return `<svg class="chart" id="${id}" viewBox="0 0 ${W} ${H}" role="img" aria-label="New followers per day">
    ${[0, max / 2, max].map((v) => `<line class="grid" x1="${P.l}" x2="${W - P.r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axis" x="${P.l - 5}" y="${Y(v) + 3}" text-anchor="end">${nf(Math.round(v))}</text>`).join('')}
    ${items.map((x, i) => { const bx = P.l + i * bw + 1, w = Math.max(1, bw - 2), top = Y(x.value), base = Y(0), r = Math.min(4, w / 2, base - top);
      const d = x.value > 0 ? `M${bx},${base}V${top + r}Q${bx},${top} ${bx + r},${top}H${bx + w - r}Q${bx + w},${top} ${bx + w},${top + r}V${base}Z` : '';
      return `${d ? `<path class="bar" data-i="${i}" d="${d}"/>` : ''}<rect data-i="${i}" x="${P.l + i * bw}" y="0" width="${bw}" height="${H}" fill="transparent"/>
        ${i % every === 0 ? `<text class="axis" x="${P.l + i * bw + bw / 2}" y="${H - 4}" text-anchor="middle">${esc(x.label)}</text>` : ''}`; }).join('')}
  </svg><div class="readout" id="${id}r">${tip(items.at(-1))}</div>`;
}
function wireBars(id, items, tip) {
  const svg = document.getElementById(id); if (!svg) return;
  const pick = (e) => { const el = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-i]'); if (!el) return; const i = +el.dataset.i;
    svg.querySelectorAll('.bar').forEach((b) => b.classList.toggle('on', +b.dataset.i === i)); document.getElementById(id + 'r').innerHTML = tip(items[i]); };
  svg.addEventListener('pointerdown', pick); svg.addEventListener('pointermove', (e) => { if (e.pressure > 0 || e.pointerType === 'mouse') pick(e); });
}

// ---------- page ----------
function render() {
  const d = D, s = d.status;
  const prog = d.followers ? Math.min(100, 100 * d.followers / d.goal.target) : 0;
  const daysLeft = Math.max(0, Math.ceil((d.goal.by - Date.now() / 1000) / 86400));
  const onPace = d.goal.pace7 != null && d.goal.perDay != null && d.goal.pace7 >= d.goal.perDay;
  const sorted = [...d.reels].sort(sortBy === 'f1k' ? (a, b) => (b.f1k ?? -1) - (a.f1k ?? -1) : sortBy === 'views' ? (a, b) => (b.views ?? 0) - (a.views ?? 0) : (a, b) => b.at - a.at);
  const reels = showAll ? sorted : sorted.slice(0, 8);
  const nfItems = d.newFollowers.map((x) => ({ label: new Date(x.date + 'T12:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }), value: x.value }));
  const nfTip = (x) => x ? `<b>${x.value}</b> new followers · ${x.label}` : '';
  const ups = {}; for (const u of d.upcoming) (ups[dayKey(u.at)] ||= []).push(u);
  const level = (t, okH, warnH) => !t ? 'warn' : (Date.now() / 1000 - t) / 3600 < okH ? 'ok' : (Date.now() / 1000 - t) / 3600 < warnH ? 'warn' : 'bad';
  const icon = { ok: '✓', warn: '!', bad: '✕' };
  const st = [
    ['Views, reach, followers', level(s.api, 2, 6), s.api ? `read ${ago(s.api)} · hourly, from the Mac or GitHub` : 'not read yet'],
    ['Follows per reel', level(s.follows, 4, 12), s.follows ? `read ${ago(s.follows)} · needs the Mac with Chrome open` : 'not read yet'],
    ['Posting', s.failedPosts ? 'bad' : 'ok', s.failedPosts ? `${s.failedPosts} post(s) failed in 3 days: open the studio` : `${d.upcoming.length} queued${d.upcoming[0] ? `, next ${dm(d.upcoming[0].at)} ${tm(d.upcoming[0].at)}` : ''}${s.extraAt ? ` · schedule as of ${ago(s.extraAt)}` : ''}`],
    ...(d.yt ? [['YouTube', level(s.yt, 2, 6), s.yt ? `read ${ago(s.yt)} · hourly, from the Mac or GitHub` : 'not read yet']] : []),
    ['Cloud sync', s.cloud ? (s.cloud.ok ? 'ok' : 'bad') : 'warn', s.cloud ? `last ran ${ago(s.cloud.at)} · runs when the Mac is off` : 'has not run yet'],
  ];
  $app.innerHTML = `
    <div class="top"><h1>reelscope</h1><div class="upd">updated ${ago(d.at)}<br>${d.by === 'github-actions' ? 'by GitHub (Mac off)' : 'by the Mac'}</div></div>
    <div class="card"><div class="hero">
      <div><div class="big">${nf(d.followers)}</div><div class="lab">followers</div></div>
      <div><div class="num">${sign(d.d1)}</div><div class="lab">today</div></div>
      <div><div class="num">${sign(d.d7)}</div><div class="lab">this week</div></div></div>
      <div class="meter" role="progressbar" aria-valuenow="${d.followers}" aria-valuemax="${d.goal.target}"><i style="width:${prog.toFixed(1)}%"></i></div>
      <div class="goal"><span><b>${nf(Math.max(0, d.goal.target - (d.followers || 0)))}</b> to ${nf(d.goal.target)} · ${daysLeft} days left</span>
        <span>need <b>${d.goal.perDay ?? '–'}</b>/day · pace <b>${d.goal.pace7 ?? '–'}</b>/day ${d.goal.pace7 != null ? (onPace ? '✓' : '') : ''}</span></div></div>
    <div class="card"><h2>Followers, 14 days</h2>${lineChart(d.followerSeries)}</div>
    <div class="tiles">
      <div class="tile"><div class="num">${nf(d.week.newFollowers)}</div><div class="lab">new followers, 7 days</div></div>
      <div class="tile"><div class="num">${nf(d.week.views)}</div><div class="lab">views, 7 days</div></div>
      <div class="tile"><div class="num">${nf(d.week.reach)}</div><div class="lab">accounts reached, 7 days</div></div>
      <div class="tile"><div class="num">${nf(d.week.profileViews)}</div><div class="lab">profile visits, 7 days</div></div></div>
    <div class="card"><h2>New followers per day</h2><div class="note">Instagram's daily count, before unfollows</div>${barChart(nfItems, 'nfb', nfTip)}
      <details><summary>Table</summary><table class="tbl"><tr><th>Day</th><th>New</th></tr>${nfItems.slice().reverse().map((x) => `<tr><td>${esc(x.label)}</td><td>${x.value}</td></tr>`).join('')}</table></details></div>
    <div class="card"><h2>Reels, 21 days</h2><div class="note">Follows per 1K views is the number that matters</div>
      <div class="seg">${[['new', 'Newest'], ['f1k', 'F per 1K'], ['views', 'Views']].map(([k, l]) => `<button data-sort="${k}" class="${sortBy === k ? 'on' : ''}">${l}</button>`).join('')}</div>
      ${reels.map((r) => `<div class="reel"><div class="t"><span>${esc(r.title)}</span>${r.trial ? '<span class="badge">trial</span>' : ''}</div>
        <div class="when">${dm(r.at)}, ${tm(r.at)}</div>
        <div class="m"><div><b>${nf(r.views)}</b><small>views</small></div><div><b>${r.follows ?? '–'}</b><small>follows</small></div><div><b>${r.f1k ?? '–'}</b><small>per 1K</small></div></div>
        <div class="s">${r.watched != null ? `watched ${r.watched}%` : ''}${r.nonf != null ? ` · ${r.nonf}% non-followers` : ''}${r.shares != null ? ` · ${r.shares} shares` : ''}${r.saves != null ? ` · ${r.saves} saves` : ''}</div></div>`).join('') || '<div class="note">No reels in 21 days.</div>'}
      ${sorted.length > 8 ? `<button class="more" id="more">${showAll ? 'Show fewer' : `Show all ${sorted.length}`}</button>` : ''}</div>
    ${d.yt ? `<div class="card"><h2>YouTube Shorts</h2><div class="note">The same reels, voice only, posted right after Instagram</div>
      <div class="hero"><div><div class="big">${nf(d.yt.subscribers)}</div><div class="lab">subscribers</div></div>
        <div><div class="num">${sign(d.yt.d1)}</div><div class="lab">today</div></div><div><div class="num">${sign(d.yt.d7)}</div><div class="lab">this week</div></div></div>
      ${d.yt.shorts.slice(0, ytAll ? 99 : 6).map((v) => `<div class="reel"><div class="t"><span>${esc(v.title)}</span></div><div class="when">${dm(v.at)}, ${tm(v.at)}</div>
        <div class="m"><div><b>${nf(v.views)}</b><small>views</small></div><div><b>${v.subs ?? '–'}</b><small>subscribers</small></div><div><b>${v.s1k ?? '–'}</b><small>per 1K engaged</small></div></div>
        <div class="s">${v.engaged != null ? `${nf(v.engaged)} engaged views` : 'numbers arrive after a day or two'}${v.watched != null ? ` · watched ${v.watched}%` : ''}</div></div>`).join('') || '<div class="note">No Shorts in 21 days yet.</div>'}
      ${d.yt.shorts.length > 6 ? `<button class="more" id="ytmore">${ytAll ? 'Show fewer' : `Show all ${d.yt.shorts.length}`}</button>` : ''}</div>` : ''}
    <div class="card"><h2>Coming up</h2><div class="note">From the studio's schedule${s.extraAt ? `, as of ${ago(s.extraAt)}` : ''}</div>
      ${Object.entries(ups).slice(0, 7).map(([k, xs]) => `<div class="day">${new Date(xs[0].at * 1000).toLocaleDateString('en-IN', { ...IST, weekday: 'long', day: 'numeric', month: 'short' })}</div>
        ${xs.map((u) => `<div class="up"><span class="h">${tm(u.at)}</span><span class="x">${esc(u.title || 'untitled')}</span>${u.b ? '<span class="badge">B</span>' : ''}${u.trial ? '<span class="badge">trial</span>' : ''}</div>`).join('')}`).join('') || '<div class="note">Nothing scheduled.</div>'}</div>
    <div class="card"><h2>Is everything running?</h2>
      ${st.map(([l, lv, dd]) => `<div class="st"><span class="i ${lv}" aria-label="${lv}">${icon[lv]}</span><div><div>${esc(l)}</div><div class="d">${esc(dd)}</div></div></div>`).join('')}</div>
    <div class="foot"><button id="refresh">Refresh</button> · <button id="forget">Forget passphrase</button></div>`;
  wireLine(d.followerSeries); wireBars('nfb', nfItems, nfTip);
  $app.querySelectorAll('[data-sort]').forEach((b) => b.onclick = () => { sortBy = b.dataset.sort; localStorage.setItem('rs.sort', sortBy); render(); });
  document.getElementById('more')?.addEventListener('click', () => { showAll = !showAll; render(); });
  document.getElementById('ytmore')?.addEventListener('click', () => { ytAll = !ytAll; render(); });
  document.getElementById('refresh').onclick = () => load();
  document.getElementById('forget').onclick = () => { localStorage.removeItem('rs.pass'); D = null; lockScreen(); };
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && D) load(); });
load();
</script>
</body>
</html>
